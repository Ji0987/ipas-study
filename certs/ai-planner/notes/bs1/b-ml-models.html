
    <div class="tw"><table><thead><tr><th>模型</th><th>核心原理</th><th>應用場景</th></tr></thead><tbody>
      <tr><td><strong>邏輯迴歸</strong></td><td>Sigmoid 函數輸出 0–1 機率，最大似然估計學習參數</td><td>醫療診斷、行銷轉換率、金融風險</td></tr>
      <tr><td><strong>支援向量機（SVM）</strong></td><td>最大化類別間距的超平面，核函數處理非線性</td><td>文本分類、圖像識別、生物資訊</td></tr>
      <tr><td><strong>決策樹</strong></td><td>資訊增益/吉尼係數遞迴分割，形成樹形規則</td><td>醫療診斷、金融風險、行銷分析</td></tr>
      <tr><td><strong>隨機森林</strong></td><td>多棵決策樹 Bagging，取投票/平均，降低過擬合</td><td>醫學影像分類、金融市場分析</td></tr>
      <tr><td><strong>神經網路</strong></td><td>多層神經元，反向傳播調整權重，學習深層特徵</td><td>語音辨識、自動駕駛、圖像辨識</td></tr>
    </tbody></table></div>
    <div class="cal ctip"><span>💡</span><div class="calbody">隨機森林 = 多棵決策樹的集成（Bagging），可有效降低單一決策樹的過擬合風險</div></div>
