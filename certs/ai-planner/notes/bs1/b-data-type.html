
    <h4>三種資料結構類型</h4>
    <div class="tw"><table><thead><tr><th>類型</th><th>說明</th><th>範例</th></tr></thead><tbody>
      <tr><td><strong>結構化資料</strong></td><td>清晰固定結構，行列形式，易查詢</td><td>MySQL、Excel 表格</td></tr>
      <tr><td><strong>半結構化資料</strong></td><td>有標籤但格式靈活，層次化描述</td><td>XML、JSON、CSV</td></tr>
      <tr><td><strong>非結構化資料</strong></td><td>無固定結構，需處理後才能分析</td><td>圖片、影像、音訊、電子郵件</td></tr>
    </tbody></table></div>
    <h4>常見資料蒐集方法</h4>
    <div class="tw"><table><thead><tr><th>方法</th><th>說明</th></tr></thead><tbody>
      <tr><td><strong>問卷與調查</strong></td><td>線上或線下收集第一手數據，用於市場研究、用戶回饋</td></tr>
      <tr><td><strong>自有產品數據</strong></td><td>企業自有網站、App、智慧裝置（手錶、汽車）的互動數據</td></tr>
      <tr><td><strong>外部公開數據</strong></td><td>政府資料開放平台 API、網路爬蟲（Scrapy）</td></tr>
      <tr><td><strong>外部付費數據</strong></td><td>向第三方購買，補充內部數據（市調數據、人口統計）</td></tr>
      <tr><td><strong>網路爬蟲</strong></td><td>抓取公開網站數據（商品價格、評論、新聞）</td></tr>
    </tbody></table></div>
