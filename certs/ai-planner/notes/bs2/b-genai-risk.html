
    <h4>主要風險類型</h4>
    <div class="tw"><table><thead><tr><th>風險</th><th>說明</th><th>應對</th></tr></thead><tbody>
      <tr><td><strong>AI 幻覺</strong></td><td>生成事實錯誤內容</td><td>RAG、人工審查、多層次驗證</td></tr>
      <tr><td><strong>資料隱私</strong></td><td>輸入內容被模型訓練使用</td><td>使用私有部署、避免輸入 PII</td></tr>
      <tr><td><strong>版權侵害</strong></td><td>生成內容侵害原作者版權</td><td>建立版權管理機制</td></tr>
      <tr><td><strong>偏見與歧視</strong></td><td>訓練數據偏頗導致不公平輸出</td><td>去偏演算法、多元訓練數據</td></tr>
      <tr><td><strong>深偽（Deepfake）</strong></td><td>偽造影像/音訊散播假資訊</td><td>法規管制、內容過濾機制</td></tr>
      <tr><td><strong>過度依賴</strong></td><td>員工不加思考直接使用 AI 輸出</td><td>培訓批判性思維、建立審查流程</td></tr>
    </tbody></table></div>
    <h4>挑戰與解決方向</h4>
    <div class="pills">
      <span class="pill pbl">模型壓縮 → 降低計算資源需求</span>
      <span class="pill ptl">RLHF → 對齊人類偏好</span>
      <span class="pill pgl">混合架構 → 提升穩定性</span>
      <span class="pill pcl">法規遵循 → AI Act、個資法</span>
    </div>
