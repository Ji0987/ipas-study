
    <h4>三大評估面向</h4>
    <p><strong>① 業務需求與痛點分析</strong>：As-Is vs. To-Be 差距；KPI 是否需提升</p>
    <p><strong>② 技術可行性</strong>：資料品質；IT 能力；AI 適配性</p>
    <p><strong>③ 成本效益評估</strong></p>
    <div class="tw"><table><thead><tr><th>指標</th><th>定義</th><th>公式</th></tr></thead><tbody>
      <tr><td><strong>ROI</strong></td><td>投資報酬率</td><td><code>(回報 − 成本) / 成本 × 100%</code></td></tr>
      <tr><td><strong>NPV</strong></td><td>淨現值</td><td><code>Σ[CF/(1+r)^t] − 初期投資</code></td></tr>
      <tr><td><strong>回收期</strong></td><td>成本回收時間</td><td><code>初期投資 / 每年淨現金流</code></td></tr>
    </tbody></table></div>
