
    <h4>導入七步驟</h4>
    <div class="tw"><table><thead><tr><th>步驟</th><th>重點</th></tr></thead><tbody>
      <tr><td><strong>1. 需求分析</strong></td><td>釐清業務痛點、定義目標與 KPI（As-Is → To-Be）</td></tr>
      <tr><td><strong>2. 技術可行性</strong></td><td>評估資料品質、IT 能力、技術成熟度</td></tr>
      <tr><td><strong>3. 成本效益</strong></td><td>ROI / NPV / 回收期；TCO 含訓練、整合、維運、合規</td></tr>
      <tr><td><strong>4. 方案設計</strong></td><td>技術應用方案、資源分配、時程與里程碑</td></tr>
      <tr><td><strong>5. POC / Pilot</strong></td><td>小規模驗證可行性與成效，降低風險</td></tr>
      <tr><td><strong>6. 正式部署</strong></td><td>系統整合、上線、使用者教育訓練</td></tr>
      <tr><td><strong>7. 監控優化</strong></td><td>效能監控、模型再訓練、持續改善</td></tr>
    </tbody></table></div>
    <div class="cal cinf"><span>💡</span><div class="calbody">關鍵順序：<strong>先定目標與 KPI，再評估資料與技術</strong>，POC 驗證後才正式部署——這是常見的步驟排序考點。</div></div>
