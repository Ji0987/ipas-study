
    <h4>五大任務類型</h4>
    <div class="tw"><table><thead><tr><th>任務</th><th>說明</th><th>應用</th></tr></thead><tbody>
      <tr><td><strong>影像分類</strong></td><td>判斷影像屬哪類別</td><td>商品辨識、醫療診斷</td></tr>
      <tr><td><strong>物件偵測</strong></td><td>辨識物件並標示邊界框</td><td>自動駕駛、安防</td></tr>
      <tr><td><strong>語意分割</strong></td><td>每個像素標類別</td><td>城市街景</td></tr>
      <tr><td><strong>實例分割</strong></td><td>分辨同類別中不同個體</td><td>自駕多目標、AR</td></tr>
      <tr><td><strong>影像生成與合成</strong></td><td>生成新影像或風格轉換</td><td>設計輔助</td></tr>
    </tbody></table></div>
    <h4>技術演進三階段</h4>
    <ul>
      <li><strong>早期（~2010）</strong>：手工特徵工程、SIFT、SVM 分類器</li>
      <li><strong>CNN 革命（2012–2020）</strong>：AlexNet → ResNet｜YOLO（偵測）｜U-Net（分割）</li>
      <li><strong>多模態+生成（2020–至今）</strong>：CLIP、ViT、DALL·E、Stable Diffusion</li>
    </ul>
