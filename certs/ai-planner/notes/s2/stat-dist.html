
    <div class="tw"><table><thead><tr><th>分佈</th><th>參數/特性</th><th>應用</th></tr></thead><tbody>
      <tr><td><strong>常態分佈</strong></td><td>μ（平均）、σ（標準差）；鐘形對稱，68-95-99.7 法則</td><td>誤差分析、身高體重</td></tr>
      <tr><td><strong>二項分佈</strong></td><td>n 次獨立試驗成功 k 次，參數 n、p</td><td>A/B 測試、良率</td></tr>
      <tr><td><strong>卜瓦松分佈</strong></td><td>單位時間事件數，參數 λ；事件獨立、平均率固定</td><td>顧客到達、瑕疵數</td></tr>
      <tr><td><strong>均勻分佈</strong></td><td>區間內所有結果等機率</td><td>隨機採樣</td></tr>
      <tr><td><strong>指數分佈</strong></td><td>事件「間隔時間」，與卜瓦松互補</td><td>等待時間、故障間隔</td></tr>
    </tbody></table></div>
    <div class="fm"><div class="fml">Z 分數（標準化）</div>Z = (x − μ) / σ　→　|Z| ≥ 3 常視為異常值<button class="cpbtn" onclick="copyFm(this,'Z = (x - μ) / σ')">複製</button></div>
    <div class="cal cinf"><span>💡</span><div class="calbody"><strong>中央極限定理（CLT）</strong>：不論母體分佈為何，樣本平均的抽樣分佈在 n 夠大時近似常態——是假設檢定與信賴區間的理論基礎。</div></div>
